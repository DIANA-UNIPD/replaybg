name: Release to PyPI

# Publishes the package to PyPI whenever a version tag (v*) is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets required.
#
# One-time setup on PyPI (project "py-replay-bg" → Settings → Publishing):
#   add a Trusted Publisher for this repo:
#     Owner:            DIANA-UNIPD
#     Repository:       replaybg
#     Workflow name:    release.yml
#     Environment:      pypi
# The 1.x line (gcappon/py_replay_bg) can be registered as a second trusted
# publisher on the same project, so both source trees publish under one name.
#
# Release ritual:
#   1. bump `version` in pyproject.toml and __version__ in
#      src/py_replay_bg/__init__.py  (e.g. 2.0.0b1 -> 2.0.0b2 -> 2.0.0rc1 -> 2.0.0)
#   2. git tag v2.0.0b1 && git push origin v2.0.0b1
#   3. this workflow builds and uploads the release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/py-replay-bg/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
